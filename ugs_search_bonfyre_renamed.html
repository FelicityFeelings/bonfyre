<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#15171b;--p:#1e2127;--p2:#2a2e37;--t:#ece9e1;--m:#9a9ca3;--a:#f2b84b;--b:#56c7b0;--ln:#343944;--shadow:rgba(0,0,0,.25)}
:root[data-theme="light"]{color-scheme:light;--bg:#f4f3ee;--p:#fff;--p2:#eceae2;--t:#1d1f24;--m:#666a73;--a:#b7791f;--b:#16836d;--ln:#d8d5ca;--shadow:rgba(31,35,40,.14)}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);background-attachment:fixed;color:var(--t);min-height:100vh;margin:0;display:flex;flex-direction:column;align-items:center;transition:background-color .2s,color .2s}
.topbar{position:fixed;top:18px;right:20px;z-index:30;display:flex;justify-content:flex-end;align-items:center}.settings-toggle{display:grid;place-items:center;width:44px;height:44px;background:var(--p);border:1px solid var(--ln);border-radius:14px;color:var(--t);font-size:21px;cursor:pointer;box-shadow:0 4px 14px var(--shadow);transition:transform .18s,border-color .18s}.settings-toggle:hover{border-color:var(--a);transform:rotate(25deg)}
.settings-backdrop{position:fixed;inset:0;z-index:40;background:#0008;display:none;align-items:flex-start;justify-content:flex-end;padding:72px 20px 20px}.settings-backdrop.open{display:flex}.settings-panel{width:min(340px,calc(100vw - 32px));max-height:calc(100vh - 100px);overflow:auto;background:var(--p);color:var(--t);border:1px solid var(--ln);border-radius:18px;padding:20px;box-shadow:0 20px 70px #0006}.settings-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.settings-head h2{font-size:20px;margin:0}.settings-close{background:transparent;color:var(--m);border:0;font-size:24px;cursor:pointer}.setting-group{padding:14px 0;border-top:1px solid var(--ln)}.setting-group strong{display:block;margin-bottom:10px;font-size:13px}.setting-options{display:flex;flex-wrap:wrap;gap:8px}.setting-option{background:var(--p2);color:var(--t);border:1px solid var(--ln);border-radius:10px;padding:9px 11px;font:500 13px Roboto,sans-serif;cursor:pointer}.setting-option.active{border-color:var(--a);box-shadow:0 0 0 1px var(--a) inset}.custom-color-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.custom-color-row input[type="color"]{width:44px;height:38px;padding:3px;border:1px solid var(--ln);border-radius:9px;background:var(--p2);cursor:pointer}.custom-color-row .hex-value{font:12px ui-monospace,monospace;color:var(--m)}.setting-check{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}.setting-check input{accent-color:var(--a);width:17px;height:17px}
.page{width:100%;margin-top:clamp(42px,8vh,85px);display:flex;flex-direction:column;align-items:center;padding:0 20px;box-sizing:border-box;position:relative;isolation:isolate}.bonfyre-fire{width:min(310px,72vw);height:280px;position:relative;display:grid;place-items:center;margin:20px auto 0;filter:drop-shadow(0 0 34px #ff6b1855);pointer-events:none}.bonfyre-glow{position:absolute;width:190%;height:125%;bottom:-8%;border-radius:50%;background:radial-gradient(ellipse at 50% 65%,#ff7618cc 0%,#ff5a1c77 25%,#f33b1533 48%,#f33b1512 65%,transparent 78%);filter:blur(30px);animation:bonfyre-glow 2.2s ease-in-out infinite alternate}.bonfyre-flames{position:absolute;inset:3% 5% 12%}.bonfyre-flame{position:absolute;bottom:12%;left:50%;transform-origin:50% 100%;border-radius:55% 45% 48% 52% / 68% 65% 35% 32%;filter:blur(.3px);animation:bonfyre-flicker 1.1s ease-in-out infinite alternate}.bonfyre-flame.outer{width:48%;height:70%;margin-left:-24%;background:linear-gradient(0deg,#ff3d18 0%,#ff7b16 47%,#ffb52e 75%,#fff0a3 100%);clip-path:polygon(50% 0,62% 19%,82% 34%,88% 54%,78% 78%,63% 94%,50% 100%,31% 94%,14% 78%,7% 58%,18% 39%,35% 26%)}.bonfyre-flame.left{width:38%;height:48%;margin-left:-36%;bottom:10%;background:linear-gradient(0deg,#ed3218,#ff8b20 66%,#ffe57a);animation-delay:-.4s;transform:rotate(-13deg);clip-path:polygon(52% 0,64% 23%,90% 41%,87% 64%,72% 84%,50% 100%,25% 91%,10% 70%,15% 48%,36% 29%)}.bonfyre-flame.right{width:37%;height:53%;margin-left:-1%;bottom:10%;background:linear-gradient(0deg,#f33b13,#ff8b18 60%,#ffe58a);animation-delay:-.7s;transform:rotate(14deg);clip-path:polygon(48% 0,67% 22%,87% 40%,94% 62%,78% 84%,52% 100%,28% 91%,12% 70%,16% 49%,35% 28%)}.bonfyre-flame.core{width:28%;height:42%;margin-left:-14%;bottom:12%;background:linear-gradient(0deg,#ff8b19,#ffd34d 57%,#fff9cf);animation-delay:-.2s;clip-path:polygon(50% 0,69% 28%,81% 48%,72% 73%,57% 94%,43% 100%,25% 85%,17% 65%,27% 42%,39% 26%)}.bonfyre-logs{position:absolute;bottom:14%;width:58%;height:12%}.bonfyre-log{position:absolute;left:8%;top:35%;width:84%;height:25%;border-radius:999px;background:linear-gradient(180deg,#754329,#39221b 55%,#211715);box-shadow:inset 0 2px 2px #d18a4d55,0 7px 9px #0005}.bonfyre-log.one{transform:rotate(19deg)}.bonfyre-log.two{transform:rotate(-19deg);background:linear-gradient(180deg,#8b4b2a,#42251a 55%,#211715)}.bonfyre-spark{position:absolute;bottom:32%;left:50%;width:4px;height:4px;border-radius:50%;background:#ffe5a0;box-shadow:0 0 8px 2px #ff8c27;animation:bonfyre-spark 2.5s linear infinite}.bonfyre-spark.s2{left:36%;animation-delay:-1.2s;animation-duration:2s}.bonfyre-spark.s3{left:64%;animation-delay:-.7s;animation-duration:2.8s}.bonfyre-spark.s4{left:45%;animation-delay:-1.8s;animation-duration:3.1s}@keyframes bonfyre-flicker{0%{filter:brightness(.94);scale:1 .96;rotate:-2deg}40%{scale:.97 1.04;rotate:1deg}100%{filter:brightness(1.12);scale:1.03 1;rotate:2deg}}@keyframes bonfyre-glow{from{opacity:.65;transform:scale(.9)}to{opacity:1;transform:scale(1.08)}}@keyframes bonfyre-spark{0%{opacity:0;transform:translate(0,15px) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translate(12px,-95px) scale(0)}}@media(prefers-reduced-motion:reduce){.bonfyre-flame,.bonfyre-glow,.bonfyre-spark{animation:none!important}}h1{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-style:italic;font-size:clamp(44px,7vw,64px);letter-spacing:-.055em;color:var(--t);text-align:center;margin:0 0 10px}.subtitle{color:var(--m);font-size:14px;margin:0;text-align:center}
.search-wrap{position:relative;width:360px;max-width:90vw;margin-top:28px;transition:width .3s ease}.search-wrap:focus-within{width:min(640px,90vw)}#searchInput{width:100%;box-sizing:border-box;padding:15px 19px;font-family:Roboto,Arial,sans-serif;font-size:16px;color:var(--t);background:var(--p);border:1px solid var(--ln);border-radius:13px;outline:none;box-shadow:0 5px 18px var(--shadow);transition:border-color .2s,box-shadow .2s}#searchInput::placeholder{color:var(--m)}#searchInput:focus{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 18%,transparent),0 7px 20px var(--shadow)}
#results{display:none;position:absolute;top:calc(100% + 8px);left:0;right:0;max-height:55vh;overflow-y:auto;background:var(--p);border:1px solid var(--ln);border-radius:13px;box-shadow:0 12px 30px var(--shadow);padding:7px;z-index:10}#results.open{display:block}#results::-webkit-scrollbar{width:6px}#results::-webkit-scrollbar-track{background:var(--p2);border-radius:4px}#results::-webkit-scrollbar-thumb{background:var(--m);border-radius:4px}.result{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;padding:11px 13px;font-family:Roboto,Arial,sans-serif;font-size:15px;font-weight:500;color:var(--t);border-radius:9px;cursor:pointer;transition:background .15s,border-color .15s}.result:hover,.result:focus{background:var(--p2);border-color:var(--ln);outline:none}.result:focus-visible{box-shadow:0 0 0 2px var(--a)}.note{padding:12px 14px;font-size:13px;color:var(--m);text-align:center}footer{margin-top:auto;padding:30px 20px 24px;text-align:center;font-size:13px;color:var(--m)}footer a{color:var(--a);text-decoration:none;font-weight:500}footer a:hover{text-decoration:underline}
.bonfyre-fire.glow-off{filter:none}.bonfyre-fire.glow-off .bonfyre-glow{opacity:0!important}.bonfyre-fire.glow-off .bonfyre-flames{filter:drop-shadow(0 0 3px #ff8c2744)}
@media (pointer:fine) and (prefers-reduced-motion:no-preference){html.ipad-cursor-ready,html.ipad-cursor-ready *{cursor:none!important}}
@media(max-width:480px){.topbar{top:12px;right:12px}.page{margin-top:8vh}.search-wrap{width:100%}.search-wrap:focus-within{width:100%}}
</style>
</head>
<body>
<div class="topbar"><button class="settings-toggle" id="settingsToggle" type="button" aria-label="Open settings" title="Settings">⚙</button></div>
<div class="settings-backdrop" id="settingsBackdrop"><div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><div class="settings-head"><h2 id="settingsTitle">Settings</h2><button class="settings-close" id="settingsClose" aria-label="Close settings">×</button></div><div class="setting-group"><strong>Appearance</strong><div class="setting-options"><button class="setting-option" data-theme-choice="dark">Dark mode</button><button class="setting-option" data-theme-choice="light">Light mode</button></div></div><div class="setting-group"><strong>Color theme</strong><div class="setting-options"><button class="setting-option" data-color="amber">Bonfyre amber</button><button class="setting-option" data-color="purple">Purple</button><button class="setting-option" data-color="blue">Ocean blue</button><button class="setting-option" data-color="pink">Pink</button><button class="setting-option" data-color="green">Forest green</button></div><div class="custom-color-row" style="margin-top:12px"><label for="customColor"><strong style="display:block;margin:0 0 5px">Custom color</strong><input type="color" id="customColor" value="#f2b84b" aria-label="Choose your own accent color"></label><span class="hex-value" id="customColorValue">#F2B84B</span><button class="setting-option" id="applyCustomColor" type="button">Use custom color</button></div></div><div class="setting-group"><label class="setting-check"><input type="checkbox" id="cursorEnabled" checked> Enable iPad-style cursor</label></div><div class="setting-group"><label class="setting-check"><input type="checkbox" id="lightEnabled" checked> Bonfire glow / lighting</label></div></div></div>
<div class="page"><h1>Bonfyre</h1><p class="subtitle">Search the Ultimate Game Stash</p><div class="search-wrap"><input type="text" id="searchInput" placeholder="Search the UGS (Don't use Spaces)" autocomplete="off" aria-label="Search games"><div id="results" role="listbox"></div></div><div class="bonfyre-fire" aria-hidden="true"><div class="bonfyre-glow"></div><div class="bonfyre-flames"><div class="bonfyre-flame outer"></div><div class="bonfyre-flame left"></div><div class="bonfyre-flame right"></div><div class="bonfyre-flame core"></div><span class="bonfyre-spark"></span><span class="bonfyre-spark s2"></span><span class="bonfyre-spark s3"></span><span class="bonfyre-spark s4"></span></div><div class="bonfyre-logs"><div class="bonfyre-log one"></div><div class="bonfyre-log two"></div></div></div></div>
<footer>Files from <a href="https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/" target="_blank" rel="noopener noreferrer">Ultimate Game Stash</a></footer>
<!-- games.js expects these elements to exist -->
<div id="sidebar" hidden></div><div id="sections-container" hidden></div>
<script src="https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/games.js"></script>
<script>
(function(){
  const root=document.documentElement, backdrop=document.getElementById('settingsBackdrop');
  const colors={amber:{a:'#f2b84b',b:'#56c7b0'},purple:{a:'#b18cff',b:'#ed8cf4'},blue:{a:'#65b8ff',b:'#5ce0dc'},pink:{a:'#ff78b7',b:'#ffc078'},green:{a:'#7ed6a2',b:'#c7e879'}};
  let theme='dark', color='amber', lightEnabled=true, customColor='#f2b84b';
  try{theme=localStorage.getItem('ugs-search-theme')||'dark';color=localStorage.getItem('ugs-search-color')||'amber';lightEnabled=localStorage.getItem('ugs-search-light')!=='false';customColor=localStorage.getItem('ugs-search-custom-color')||'#f2b84b';}catch(e){}
  if(!['dark','light'].includes(theme))theme='dark'; if(!colors[color])color='amber';
  function applyTheme(next,save=true){theme=next==='light'?'light':'dark';root.dataset.theme=theme;if(save)try{localStorage.setItem('ugs-search-theme',theme)}catch(e){}updateButtons();}
  function validHex(v){return /^#[0-9a-fA-F]{6}$/.test(v)}
  function applyColor(next,save=true){if(!colors[next])return;color=next;root.style.setProperty('--a',colors[color].a);root.style.setProperty('--b',colors[color].b);root.style.removeProperty('--custom-accent');if(save)try{localStorage.setItem('ugs-search-color',color);localStorage.removeItem('ugs-search-custom-color')}catch(e){}updateButtons();}
  function applyCustomColor(value,save=true){if(!validHex(value))return;customColor=value;root.style.setProperty('--a',value);root.style.setProperty('--b',value);root.style.setProperty('--custom-accent',value);color='custom';document.getElementById('customColor').value=value;document.getElementById('customColorValue').textContent=value.toUpperCase();if(save)try{localStorage.setItem('ugs-search-color','custom');localStorage.setItem('ugs-search-custom-color',value)}catch(e){}updateButtons();}
  function applyLight(on,save=true){lightEnabled=!!on;document.querySelector('.bonfyre-fire').classList.toggle('glow-off',!lightEnabled);if(save)try{localStorage.setItem('ugs-search-light',String(lightEnabled))}catch(e){}document.getElementById('lightEnabled').checked=lightEnabled;}
  function updateButtons(){document.querySelectorAll('[data-theme-choice]').forEach(b=>b.classList.toggle('active',b.dataset.themeChoice===theme));document.querySelectorAll('[data-color]').forEach(b=>b.classList.toggle('active',b.dataset.color===color));document.getElementById('customColor').value=customColor;document.getElementById('customColorValue').textContent=customColor.toUpperCase();document.getElementById('applyCustomColor').classList.toggle('active',color==='custom');}
  const open=()=>{backdrop.classList.add('open');document.getElementById('settingsToggle').setAttribute('aria-expanded','true')};
  const close=()=>{backdrop.classList.remove('open');document.getElementById('settingsToggle').setAttribute('aria-expanded','false')};
  document.getElementById('settingsToggle').addEventListener('click',open);document.getElementById('settingsClose').addEventListener('click',close);backdrop.addEventListener('click',e=>{if(e.target===backdrop)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
  document.querySelectorAll('[data-theme-choice]').forEach(b=>b.addEventListener('click',()=>applyTheme(b.dataset.themeChoice)));
  document.querySelectorAll('[data-color]').forEach(b=>b.addEventListener('click',()=>applyColor(b.dataset.color)));
  const colorPicker=document.getElementById('customColor');colorPicker.addEventListener('input',()=>{document.getElementById('customColorValue').textContent=colorPicker.value.toUpperCase()});document.getElementById('applyCustomColor').addEventListener('click',()=>applyCustomColor(colorPicker.value));
  const cursor=document.getElementById('cursorEnabled');let cursorOn=true;try{cursorOn=localStorage.getItem('cursorEnabled')!=='false'}catch(e){}cursor.checked=cursorOn;cursor.addEventListener('change',()=>{cursorOn=cursor.checked;try{localStorage.setItem('cursorEnabled',String(cursorOn))}catch(e){}if(window.setBonfyreCursorEnabled)window.setBonfyreCursorEnabled(cursorOn)});
  document.getElementById('lightEnabled').addEventListener('change',e=>applyLight(e.target.checked));
  applyTheme(theme,false);if(color==='custom'&&/^#[0-9a-fA-F]{6}$/.test(customColor))applyCustomColor(customColor,false);else applyColor(color,false);applyLight(lightEnabled,false);updateButtons();
})();

// Build the game list from games.js, with the leading "cl" removed from each name.
const games=[...new Set((typeof files!=='undefined'&&Array.isArray(files)?files:[]).filter(f=>typeof f==='string'&&f.toLowerCase().startsWith('cl')&&f.length>2))]
 .map(f=>({file:f,name:f.slice(2)})).sort((a,b)=>a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
const input=document.getElementById('searchInput'),results=document.getElementById('results'),MAX_RESULTS=60;
const TAB_TITLE='math - Google Search';
function lockTitle(win){try{const s=win.document.createElement('script');s.textContent='(function(){var T='+JSON.stringify(TAB_TITLE)+';try{Object.defineProperty(document,"title",{get:function(){return T},set:function(){},configurable:true});}catch(e){}function fix(){var t=document.querySelector("title");if(!t){t=document.createElement("title");(document.head||document.documentElement).appendChild(t);}if(t.textContent!==T)t.textContent=T;}fix();new MutationObserver(fix).observe(document.head||document.documentElement,{childList:true,subtree:true,characterData:true});setInterval(fix,1000);})();';win.document.head.appendChild(s)}catch(e){}}
function openGame(file){const win=window.open('about:blank','_blank');if(!win){alert('Your browser blocked the new tab. Allow popups for this page and try again.');return}win.document.write('<!doctype html><title>'+TAB_TITLE+'</title>Loading...');let name=file;if(!(name.includes('.')&&name.lastIndexOf('.')>0))name+='.html';fetch('https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile/UGS-Files/'+encodeURIComponent(name)+'?t='+Date.now()).then(response=>{if(!response.ok)throw Error('Failed to load');return response.text()}).then(text=>{win.document.open();win.document.write(text);win.document.close();lockTitle(win)}).catch(()=>{try{win.document.body.textContent='Could not load this game.'}catch(e){}})}
function showResults(){const query=input.value.toLowerCase().trim();results.innerHTML='';if(query===''){results.classList.remove('open');return}const matches=games.filter(g=>g.name.toLowerCase().includes(query));results.classList.add('open');if(matches.length===0){const none=document.createElement('div');none.className='note';none.textContent='No games found';results.appendChild(none);return}matches.slice(0,MAX_RESULTS).forEach(g=>{const btn=document.createElement('button');btn.type='button';btn.className='result';btn.textContent=g.name;btn.setAttribute('role','option');btn.onclick=()=>openGame(g.file);results.appendChild(btn)});if(matches.length>MAX_RESULTS){const more=document.createElement('div');more.className='note';more.textContent='Showing the first '+MAX_RESULTS+' of '+matches.length+' — keep typing to narrow it down';results.appendChild(more)}}
input.addEventListener('input',showResults);input.addEventListener('focus',showResults);input.addEventListener('keydown',e=>{if(e.key==='Enter'){const first=results.querySelector('.result');if(first)first.click()}if(e.key==='Escape')results.classList.remove('open')});document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))results.classList.remove('open')});
</script>
<script type="module">
let cursorModule=null,cursorActive=false,targetObserver=null;
const finePointer=window.matchMedia('(pointer: fine)').matches,motionAllowed=!window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const settingEnabled=()=>{try{return localStorage.getItem('cursorEnabled')!=='false'}catch(e){return true}};
function tagTargets(root=document){if(!root||!root.querySelectorAll)return;root.querySelectorAll('a,button,.result,[role="button"]').forEach(el=>{if(!el.hasAttribute('data-cursor'))el.setAttribute('data-cursor','block')});root.querySelectorAll('input:not([type="button"]):not([type="submit"]):not([type="checkbox"]),textarea,[contenteditable="true"]').forEach(el=>{if(!el.hasAttribute('data-cursor'))el.setAttribute('data-cursor','text')})}
function config(){const light=document.documentElement.dataset.theme==='light',stroke=light?'rgba(25,29,36,.88)':'rgba(255,255,255,.9)';return {enableLighting:false,enableMouseDownEffect:true,enableAutoTextCursor:true,enableAutoUpdateCursor:true,normalStyle:{width:16,height:16,radius:'50%',background:'transparent',border:`1px solid ${stroke}`,backdropBlur:'0px',durationPosition:65},textStyle:{width:3,height:22,radius:'3px',background:stroke,border:'0',backdropBlur:'0px',durationPosition:55},blockStyle:{radius:'auto',background:'transparent',border:`1px solid ${stroke}`,backdropBlur:'0px',durationPosition:70},mouseDownStyle:{scale:.94,background:'transparent',backdropBlur:'0px'}}}
function start(){if(!cursorModule||cursorActive||!finePointer||!motionAllowed||!settingEnabled())return;try{tagTargets();cursorModule.initCursor(config());cursorActive=true;document.documentElement.classList.add('ipad-cursor-ready');if(!targetObserver){targetObserver=new MutationObserver(records=>records.forEach(r=>r.addedNodes.forEach(n=>{if(n.nodeType===1)tagTargets(n)})));targetObserver.observe(document.body,{childList:true,subtree:true})}}catch(e){document.documentElement.classList.remove('ipad-cursor-ready');cursorActive=false;console.warn('iPad cursor unavailable',e)}}
function stop(){document.documentElement.classList.remove('ipad-cursor-ready');if(cursorActive&&cursorModule&&typeof cursorModule.disposeCursor==='function'){try{cursorModule.disposeCursor()}catch(e){}}cursorActive=false}
window.setBonfyreCursorEnabled=enabled=>enabled?start():stop();
try{if(finePointer&&motionAllowed){const m=await import('https://unpkg.com/ipad-cursor@0.5.2');cursorModule=m.default||m;if(settingEnabled())start();new MutationObserver(()=>{if(cursorActive&&cursorModule&&typeof cursorModule.updateConfig==='function')try{cursorModule.updateConfig(config())}catch(e){}}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']})}}catch(e){document.documentElement.classList.remove('ipad-cursor-ready');console.warn('iPad cursor failed to load',e)}
</script>
</body>
</html>
